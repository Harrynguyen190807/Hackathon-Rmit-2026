      async function computeRealSha256(str) {
        try {
          const msgBuffer = new TextEncoder().encode(str);
          const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          const hashHex = hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
          return '0x' + hashHex;
        } catch (e) {
          return '0x8f4e9b21d4c3e80291a0b3e7f1298a4bc71a04';
        }

      function ScannerTab({ currentRx, onUpdateRx, onNavigate, onSaveSchedule }) {
        const [cameraActive, setCameraActive] = useState(false);
        const [facingMode, setFacingMode] = useState('environment');
        const [cameraError, setCameraError] = useState('');
        const [capturedImage, setCapturedImage] = useState(null);
        const [isProcessingOcr, setIsProcessingOcr] = useState(false);
        const [ocrProgress, setOcrProgress] = useState(0);
        const [ocrStatusText, setOcrStatusText] = useState('');
        const [proofHash, setProofHash] = useState('0x8f4e9b21d4c3e80291a0b3e7f1298a4bc71a04');
        const [savedToast, setSavedToast] = useState(false);
        const [showRawOcr, setShowRawOcr] = useState(false);

        const videoRef = useRef(null);
        const streamRef = useRef(null);
        const fileInputRef = useRef(null);

        const stopCamera = () => {
          if (streamRef.current) {
            streamRef.current.getTracks().forEach((track) => track.stop());
            streamRef.current = null;
          }
          setCameraActive(false);
        };

        useEffect(() => {
          return () => stopCamera();
        }, []);

        const startRealCamera = async (mode = facingMode) => {
          setCameraError('');
          stopCamera();
          try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
              throw new Error('Trình duyệt yêu cầu mở qua http://localhost:8000 để cấp quyền Camera trực tiếp.');
            }
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: mode, width: { ideal: 1280 }, height: { ideal: 720 } },
              audio: false,
            });
            streamRef.current = stream;
            setCameraActive(true);
            setCapturedImage(null);
            setTimeout(() => {
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
                videoRef.current.play().catch(() => {});
              }
            }, 50);
          } catch (err) {
            setCameraError(
              window.location.protocol === 'file:'
                ? 'Chrome chặn Webcam trên giao thức file://. Hãy mở http://localhost:8000 hoặc bấm "Tải Ảnh Đơn Thuốc"!'
                : 'Không thể truy cập Camera (' + (err.message || 'Vui lòng cấp quyền Camera') + '). Bạn có thể tải ảnh lên trực tiếp!'
            );
          }
        };

        const toggleCameraFacing = () => {
          const nextMode = facingMode === 'environment' ? 'user' : 'environment';
          setFacingMode(nextMode);
          if (cameraActive) {
            startRealCamera(nextMode);
          }
        };

        const processImageWithRealOcr = async (dataUrl, sourceLabel = 'Camera Frame') => {
          setIsProcessingOcr(true);
          setOcrProgress(10);
          setOcrStatusText('TideCloak Edge: Đang mã hóa SHA-256...');

          const realHash = await computeRealSha256(dataUrl.slice(0, 4096) + Date.now());
          setProofHash(realHash);

          try {
            if (window.Tesseract) {
              setOcrStatusText('Đang chạy OCR nhận diện đơn thuốc...');
              const result = await window.Tesseract.recognize(dataUrl, 'eng+vie', {
                logger: (m) => {
                  if (m.status === 'recognizing text' && typeof m.progress === 'number') {
                    setOcrProgress(Math.max(15, Math.round(m.progress * 100)));
                  }
                },
              });
              const extractedText = result?.data?.text || '';
              const analyzed = analyzeOcrPrescriptionText(extractedText, sourceLabel);
              onUpdateRx(analyzed);
              setShowRawOcr(true);
            } else {
              const analyzed = analyzeOcrPrescriptionText('', sourceLabel);
              onUpdateRx(analyzed);
            }
          } catch (err) {
            const analyzed = analyzeOcrPrescriptionText('', sourceLabel);
            onUpdateRx(analyzed);
          } finally {
            setOcrProgress(100);
            setTimeout(() => {
              setIsProcessingOcr(false);
              setOcrStatusText('');
            }, 350);
          }
        };

        const captureFromWebcam = () => {
          if (!videoRef.current) return;
          const video = videoRef.current;
          const canvas = document.createElement('canvas');
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
          stopCamera();
          setCapturedImage(dataUrl);
          processImageWithRealOcr(dataUrl, 'Ảnh chụp Camera trực tiếp');
        };

        const handleFileUpload = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          stopCamera();
          setCameraError('');
          const reader = new FileReader();
          reader.onload = (ev) => {
            const dataUrl = ev.target?.result;
            if (typeof dataUrl === 'string') {
              setCapturedImage(dataUrl);
              processImageWithRealOcr(dataUrl, file.name);
            }
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        };

        const handleSelectPreset = async (presetKey) => {
          stopCamera();
          setCapturedImage(null);
          setCameraError('');
          const preset = SYNTHETIC_DATA.prescriptions[presetKey];
          const hash = await computeRealSha256(JSON.stringify(preset) + Date.now());
          setProofHash(hash);
          onUpdateRx(preset);
        };

        const handleSave = () => {
          onSaveSchedule(currentRx.medications);
          setSavedToast(true);
          setTimeout(() => setSavedToast(false), 2200);
        };

        const isCritical = currentRx.interaction?.severity === 'CRITICAL';

        return (
          <div className="space-y-3.5 pb-6">
            <div className="flex items-center justify-between">
              <div>
                <h2 className="text-lg font-bold text-[#1A201C]">Quét Đơn Thuốc AI</h2>
                <p className="text-xs text-[#687771]">Camera thực & Tải ảnh OCR tại Edge</p>
              </div>
              <span className="px-2.5 py-1 rounded-full bg-[#cceda3] text-[#0b3026] text-[10px] font-bold">
                {currentRx.confidence}
              </span>
            </div>

            <TideCloakBadge
              context="Prescription OCR Sanitized Before AI Analysis"
              proofHash={proofHash}
              medications={currentRx.medications}
            />

            <input
              ref={fileInputRef}
              type="file"
              accept="image/*"
              onChange={handleFileUpload}
              className="hidden"
            />

            <div className="grid grid-cols-2 gap-2">
              {!cameraActive ? (
                <button
                  type="button"
                  onClick={() => startRealCamera()}
                  className="flex items-center justify-center gap-2 py-2.5 px-3 rounded-2xl bg-[#0b3026] text-[#cceda3] text-xs font-extrabold shadow-md hover:bg-[#24473b] active:scale-95 transition-all"
                >
                  <IconCamera className="w-4 h-4" />
                  <span>Bật Camera Thực</span>
                </button>
              ) : (
                <button
                  type="button"
                  onClick={stopCamera}
                  className="flex items-center justify-center gap-2 py-2.5 px-3 rounded-2xl bg-[#ba1a1a] text-white text-xs font-extrabold shadow-md active:scale-95 transition-all"
                >
                  <span>✕ Tắt Camera</span>
                </button>
              )}

              <button
                type="button"
                onClick={() => fileInputRef.current?.click()}
                className="flex items-center justify-center gap-2 py-2.5 px-3 rounded-2xl bg-[#cceda3] text-[#0b3026] text-xs font-extrabold shadow-md hover:bg-[#b1d189] active:scale-95 transition-all"
              >
                <IconUpload className="w-4 h-4" />
                <span>Tải Ảnh Đơn Thuốc</span>
              </button>
            </div>

            {cameraError && (
              <div className="rounded-2xl bg-[#ffdcc5] border border-[#F3A871] p-3 text-xs text-[#462000] space-y-1">
                <div className="font-bold">Lưu ý quyền truy cập Camera:</div>
                <p className="text-[11px]">{cameraError}</p>
                {window.location.protocol === 'file:' && (
                  <a
                    href="http://localhost:8000"
                    className="inline-block mt-1 px-3 py-1 rounded-full bg-[#0b3026] text-[#cceda3] font-bold text-[11px]"
                  >
                    Mở http://localhost:8000 để bật Webcam &rarr;
                  </a>
                )}
              </div>
            )}

            <div className="rounded-3xl bg-white p-3 shadow-sm border border-[#ECE7DC]">
              <div className="relative w-full h-64 rounded-2xl overflow-hidden bg-[#10261e] flex flex-col justify-between p-3">
                {cameraActive && (
                  <video
                    ref={videoRef}
                    autoPlay
                    playsInline
                    muted
                    className="absolute inset-0 w-full h-full object-cover z-0"
                  />
                )}

                {!cameraActive && capturedImage && (
                  <img
                    src={capturedImage}
                    alt="Uploaded Prescription"
                    className="absolute inset-0 w-full h-full object-contain bg-black/80 z-0"
                  />
                )}

                {!cameraActive && !capturedImage && (
                  <div className="relative z-10 bg-[#FBF8F2]/95 rounded-xl p-3 border border-[#ECE7DC] text-[#1A201C] space-y-1.5 shadow-inner my-auto">
                    <div className="flex justify-between items-center text-[10px] font-bold border-b border-[#ECE7DC] pb-1">
                      <span className="text-[#24473b] truncate max-w-[200px]">{currentRx.title}</span>
                      <span className="text-[#687771] font-mono">[PII_REDACTED]</span>
                    </div>
                    <div className="space-y-1 text-xs">
                      {currentRx.medications.map((m, i) => (
                        <div key={m.id} className="flex justify-between bg-white px-2 py-1 rounded border border-[#ECE7DC]">
                          <span className="font-bold text-[#0b3026] truncate">{i + 1}. {m.name} ({m.dosage})</span>
                          <span className="font-mono text-[10px] text-[#687771] shrink-0 ml-1">{m.time}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="relative z-20 flex items-center justify-between">
                  <span className="px-2.5 py-1 rounded-full bg-[#0b3026]/85 backdrop-blur-md text-[#cceda3] text-[10px] font-bold flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-[#cceda3] animate-ping" />
                    {isProcessingOcr
                      ? `${ocrStatusText} (${ocrProgress}%)`
                      : cameraActive
                      ? 'Camera Trực Tiếp Đang Bật • Đưa đơn thuốc vào khung'
                      : capturedImage
                      ? 'Đã quét ảnh thực tế • Đã ẩn danh PII'
                      : `Đã nhận diện ${currentRx.medications.length} loại thuốc`}
                  </span>

                  {cameraActive && (
                    <button
                      type="button"
                      onClick={toggleCameraFacing}
                      className="px-2.5 py-1 rounded-full bg-white/90 text-[#0b3026] text-[10px] font-bold shadow"
                    >
                      Đổi Camera
                    </button>
                  )}

                  {!cameraActive && capturedImage && (
                    <button
                      type="button"
                      onClick={() => setCapturedImage(null)}
                      className="px-2.5 py-1 rounded-full bg-white/90 text-[#93000a] text-[10px] font-bold shadow"
                    >
                      Xóa ảnh
                    </button>
                  )}
                </div>

                <div className="absolute left-3 right-3 h-0.5 bg-gradient-to-r from-transparent via-[#cceda3] to-transparent shadow-[0_0_12px_#cceda3] animate-scan-laser pointer-events-none z-20" />
                <div className="absolute inset-2.5 border-2 border-[#cceda3]/40 rounded-2xl pointer-events-none z-10" />

                <div className="relative z-20 flex items-center justify-center gap-3">
                  {cameraActive ? (
                    <button
                      type="button"
                      onClick={captureFromWebcam}
                      className="px-5 py-2 rounded-full bg-[#cceda3] text-[#0b3026] font-extrabold text-xs shadow-lg flex items-center gap-1.5 active:scale-95 transition-transform ring-4 ring-white/40"
                    >
                      <IconCamera className="w-4 h-4" />
                      <span>Chụp & Quét OCR Ngay</span>
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={() => fileInputRef.current?.click()}
                      className="px-4 py-1.5 rounded-full bg-white/95 text-[#0b3026] font-bold text-[11px] shadow-md flex items-center gap-1.5 hover:bg-[#cceda3] transition-colors"
                    >
                      <IconUpload className="w-3.5 h-3.5" />
                      <span>Chọn ảnh từ máy / Điện thoại</span>
                    </button>
                  )}
                </div>
              </div>

              {isProcessingOcr && (
                <div className="mt-2.5 bg-[#f6f3ed] rounded-xl p-2.5 border border-[#ECE7DC]">
                  <div className="flex justify-between text-[11px] font-bold text-[#0b3026] mb-1">
                    <span>{ocrStatusText}</span>
                    <span>{ocrProgress}%</span>
                  </div>
                  <div className="w-full h-2 bg-[#e5e2dc] rounded-full overflow-hidden">
                    <div className="h-full bg-[#4b662b] transition-all duration-300" style={{ width: `${ocrProgress}%` }} />
                  </div>
                </div>
              )}

              <div className="mt-2.5 pt-2 border-t border-[#ECE7DC]">
                <div className="text-[10px] font-bold text-[#687771] uppercase mb-1.5 px-1">
                  Hoặc nạp nhanh đơn mẫu kiểm thử:
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => handleSelectPreset('standardCardioRx')}
                    className="py-2 px-2 rounded-xl text-xs font-bold bg-[#c7e89e]/70 hover:bg-[#c7e89e] text-[#0b3026] transition-colors"
                  >
                    Mẫu 1: Tim Mạch (Vàng)
                  </button>
                  <button
                    type="button"
                    onClick={() => handleSelectPreset('criticalConflictRx')}
                    className="py-2 px-2 rounded-xl text-xs font-bold bg-[#ffdad6]/80 hover:bg-[#ffdad6] text-[#93000a] transition-colors"
                  >
                    Mẫu 2: Xung Đột Nặng (Đỏ)
                  </button>
                </div>
              </div>
            </div>

            {currentRx.rawOcrText && (
              <div className="rounded-2xl bg-white p-3 border border-[#ECE7DC] shadow-sm">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-[#0b3026] flex items-center gap-1.5">
                    <IconShieldCheck className="w-4 h-4 text-[#4b662b]" />
                    Văn bản OCR bóc tách (Đã che PII tại Edge)
                  </span>
                  <button
                    type="button"
                    onClick={() => setShowRawOcr(!showRawOcr)}
                    className="text-[11px] font-bold text-[#24473b] underline"
                  >
                    {showRawOcr ? 'Thu gọn' : 'Xem chi tiết'}
                  </button>
                </div>
                {showRawOcr && (
                  <pre className="mt-2 p-2.5 rounded-xl bg-[#f6f3ed] text-[11px] font-mono text-[#1A201C] whitespace-pre-wrap max-h-32 overflow-y-auto border border-[#ECE7DC]">
                    {currentRx.rawOcrText}
                  </pre>
                )}
              </div>
            )}

            {currentRx.interaction && (
              <div
                className={`rounded-2xl p-4 border flex items-start gap-3 ${
                  isCritical
                    ? 'bg-[#ffdad6] text-[#93000a] border-[#ba1a1a]/30'
                    : 'bg-[#ffdcc5] text-[#462000] border-[#F3A871]/50'
                }`}
              >
                <div
                  className={`w-8 h-8 rounded-xl flex items-center justify-center shrink-0 ${
                    isCritical ? 'bg-[#ba1a1a] text-white' : 'bg-[#F3A871] text-white'
                  }`}
                >
                  <IconAlertTriangle className="w-5 h-5" />
                </div>
                <div className="text-xs space-y-0.5 flex-1">
                  <div className="flex items-center justify-between flex-wrap gap-1">
                    <span className="font-extrabold">{currentRx.interaction.title}</span>
                    <span className="text-[9px] px-1.5 py-0.5 rounded font-extrabold uppercase bg-white/70">
                      {currentRx.interaction.badge}
                    </span>
                  </div>
                  <p className="leading-relaxed opacity-95">{currentRx.interaction.desc}</p>
                </div>
              </div>
            )}

            <div className="space-y-2">
              <h3 className="text-xs font-bold text-[#1A201C] px-1">
                Danh sách thuốc bóc tách ({currentRx.medications.length} loại)
              </h3>
              {currentRx.medications.map((m) => (
                <div
                  key={m.id}
                  className="rounded-2xl bg-white p-3.5 shadow-sm border border-[#ECE7DC] flex items-center justify-between"
                >
                  <div className="flex items-center gap-2.5 min-w-0">
                    <div className="w-9 h-9 rounded-xl bg-[#f6f3ed] flex items-center justify-center text-[#24473b] shrink-0">
                      <IconPill className="w-4 h-4" />
                    </div>
                    <div className="min-w-0">
                      <div className="text-xs font-bold text-[#1A201C] truncate">
                        {m.name} <span className="text-[#4b662b]">({m.dosage})</span>
                      </div>
                      <div className="text-[11px] text-[#687771] truncate">
                        {m.instruction} • {m.category}
                      </div>
                    </div>
                  </div>
                  <div className="text-right shrink-0 pl-2">
                    <span className="text-sm font-extrabold text-[#0b3026]">{m.time}</span>
                    <span className="block text-[9px] text-[#687771] uppercase font-bold">
                      {m.period}
                    </span>
                  </div>
                </div>
              ))}
            </div>

            <div className="space-y-2 pt-1">
              <button
                type="button"
                onClick={handleSave}
                className={`w-full py-3.5 rounded-full text-xs font-bold text-white shadow-md transition-all ${
                  savedToast ? 'bg-[#4b662b]' : 'bg-[#24473b] hover:bg-[#0b3026]'
                }`}
              >
                {savedToast
                  ? '✓ Đã đồng bộ vào Lịch nhắc thuốc!'
                  : 'Lưu lịch uống thuốc tự động (08:00, 19:00, 21:30)'}
              </button>
              <button
                type="button"
                onClick={() => onNavigate('ai')}
                className="w-full py-3 rounded-full text-xs font-bold text-[#0b3026] bg-[#F5EFE4] hover:bg-[#e5e2dc] transition-colors"
              >
                Hỏi Bác Sĩ AI giải mã đơn này &rarr;
              </button>
            </div>
          </div>
        );
      }

      // ==========================================
      // TAB 3: AI ASSISTANT
      // ==========================================
      function AiAssistantTab({ currentRx }) {
        const [messages, setMessages] = useState([
          { id: 1, role: 'user', text: 'Đơn thuốc vừa quét có lưu ý hay tác dụng phụ gì quan trọng không?' },
          {
            id: 2,
            role: 'ai',
            text: `Dựa trên hồ sơ dược lý ẩn danh (Zero-Knowledge Attested) gồm ${currentRx.medications.map(m => m.name).join(', ')}:`,
            details: [
              currentRx.interaction?.desc || 'Các thuốc trong đơn cần uống đúng khung giờ cố định.',
              'Xử trí khi quên liều: Nếu còn trên 12 tiếng tới liều kế tiếp thì uống ngay. Tuyệt đối KHÔNG uống gấp đôi liều để bù.'
            ]
          }
        ]);
        const [input, setInput] = useState('');

        const handleSend = (text) => {
          const q = (text || input).trim();
          if (!q) return;
          const userM = { id: Date.now(), role: 'user', text: q };
          setMessages((prev) => [...prev, userM]);
          if (!text) setInput('');

          setTimeout(() => {
            const medNames = currentRx.medications.map((m) => `${m.name} (${m.dosage})`).join(', ');
            let replyText = `Đã phân tích câu hỏi "${q}" trên vùng dữ liệu mã hóa TideCloak Edge cho đơn: ${medNames}.`;
            let details = [];
            if (q.includes('ăn') || q.includes('khi nào')) {
              details = currentRx.medications.map(
                (m) => `${m.time} (${m.period}): ${m.name} ${m.dosage} — ${m.instruction}`
              );
            } else if (q.includes('kiêng') || q.includes('bưởi')) {
              details = [
                currentRx.interaction?.desc || 'Kiêng nước ép bưởi chùm (Grapefruit) và rượu bia.',
                'Chế độ ăn giảm muối (< 5g/ngày) và uống đủ 2L nước lọc.'
              ];
            } else {
              details = [
                currentRx.interaction?.desc || 'Phác đồ hiện tại an toàn khi tuân thủ đúng liều.',
                'Chỉ số sinh trắc học (HA 120/78 mmHg, Nhịp tim 70 bpm) đang ở ngưỡng ổn định.'
              ];
            }
            setMessages((prev) => [...prev, { id: Date.now() + 1, role: 'ai', text: replyText, details }]);
          }, 350);
        };

        return (
          <div className="space-y-3.5 pb-6">
            <div className="flex items-center justify-between bg-white p-3 rounded-2xl border border-[#ECE7DC] shadow-sm">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-full bg-[#c7e89e] flex items-center justify-center text-[#0b3026]"><IconBot className="w-4 h-4" /></div>
                <div>
                  <div className="text-xs font-bold text-[#1A201C]">Asclepios AI Bác Sĩ</div>
                  <div className="text-[10px] text-[#687771]">Đang đồng bộ với: {currentRx.title}</div>
                </div>
              </div>
              <span className="px-2 py-0.5 rounded-full bg-[#f6f3ed] text-[#4b662b] text-[10px] font-bold">E2E ZKP</span>
            </div>

            <TideCloakBadge
              context="Zero-Knowledge Proof Verified • Anonymous AI Context"
              medications={currentRx.medications}
            />

            <div className="space-y-3">
              {messages.map((m) => (
                <div key={m.id} className={`flex flex-col ${m.role === 'user' ? 'items-end' : 'items-start'}`}>
                  <div className={`p-3.5 rounded-2xl text-xs max-w-[88%] leading-relaxed ${m.role === 'user' ? 'bg-[#24473b] text-white rounded-tr-sm' : 'bg-white text-[#1A201C] border border-[#ECE7DC] rounded-tl-sm shadow-sm'}`}>
                    <p>{m.text}</p>
                    {m.details && (
                      <div className="mt-2 space-y-1.5 pt-1.5 border-t border-[#ECE7DC]">
                        {m.details.map((d, i) => (
                          <div key={i} className="text-[11px] text-[#414845] bg-[#f6f3ed] p-2 rounded-xl">• {d}</div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>

            <div className="flex gap-1.5 overflow-x-auto no-scrollbar py-1">
              {['Tác dụng phụ?', 'Uống trước hay sau ăn?', 'Cần kiêng cữ gì?', 'Kết nối bác sĩ'].map((c) => (
                <button
                  key={c}
                  onClick={() => handleSend(c)}
                  className="shrink-0 bg-white border border-[#ECE7DC] px-3 py-1.5 rounded-full text-xs font-bold text-[#0b3026] hover:bg-[#f6f3ed]"
                >
                  {c}
                </button>
              ))}
            </div>

            <div className="flex gap-2 bg-white p-2 rounded-2xl border border-[#ECE7DC] shadow-sm">
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                placeholder="Hỏi AI bảo mật về đơn thuốc..."
                className="flex-1 text-xs outline-none px-2"
              />
              <button onClick={() => handleSend()} className="w-8 h-8 rounded-full bg-[#24473b] text-white flex items-center justify-center text-xs font-bold">&uarr;</button>
            </div>
          </div>
        );
      }

      // ==========================================
      // TAB 4: LỊCH TRÌNH (08:00, 19:00, 21:30)
      // ==========================================
      function ScheduleTab({ schedule, onToggle }) {
        const completed = schedule.filter((s) => s.taken).length;
        const adherence = Math.round((completed / schedule.length) * 100);

        return (
          <div className="space-y-4 pb-6">
            <div className="bg-white rounded-3xl p-4 shadow-sm border border-[#ECE7DC]">
              <div className="flex justify-between items-center mb-3">
                <span className="text-sm font-bold text-[#1A201C]">Tháng 10, 2026</span>
                <span className="text-xs font-bold text-[#4b662b]">{adherence}% Tuân thủ tuần này</span>
              </div>
              <div className="grid grid-cols-7 gap-1 text-center text-xs">
                {['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'].map((d, i) => (
                  <div key={d} className="flex flex-col items-center gap-1">
                    <span className="text-[10px] text-[#687771]">{d}</span>
                    <span className={`w-8 h-8 rounded-full flex items-center justify-center font-bold ${i === 3 ? 'bg-[#0b3026] text-white shadow-sm' : 'text-[#1A201C]'}`}>

                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${item.taken ? 'bg-[#c7e89e] text-[#0b3026]' : 'bg-[#ffdcc5] text-[#663304]'}`}>

                </div>
                <div className="col-span-5 py-2 px-2 rounded-2xl bg-[#f6f3ed] text-[#0b3026] text-center">

                  <div className="text-[10px] font-bold text-[#687771]">81 ĐÃ ĐẠT</div>
                </div>
                <div className="col-span-2 rounded-2xl bg-[#f6f3ed] flex items-center justify-center text-sm">🎁</div>
              </div>
            </section>

            {/* CORE DEMO MOMENT: Patient-Controlled Access via TideCloak Emergent Authority */}
            <section className="rounded-3xl p-4 bg-gradient-to-br from-[#0b3026] to-[#24473b] text-white shadow-md space-y-2.5">
              <div className="flex items-center justify-between">
                <div>
                  <span className="text-[10px] font-extrabold uppercase tracking-wider text-[#cceda3] block">

                  </span>
                  <span className="text-xs font-bold">Patient-Controlled Clinician Access</span>
                </div>
                <button
                  type="button"
                  onClick={() => setClinicianUnlocked(!clinicianUnlocked)}
                  className={`px-3 py-1.5 rounded-full text-[10px] font-extrabold transition-all ${
                    clinicianUnlocked ? 'bg-[#cceda3] text-[#0b3026]' : 'bg-white/15 text-white'
                  }`}
                >
                  {clinicianUnlocked ? '🔓 Đã cấp quyền (15p)' : '🔒 Đang khóa bảo mật'}
                </button>
              </div>
              <div className="rounded-2xl bg-black/25 p-2.5 text-[11px] space-y-1 font-mono border border-white/10">
                <div className="flex justify-between">
                  <span className="text-[#a9cfbf]">Dị ứng & Tương tác:</span>

                <div className="flex justify-between">

            </section>

            {/* Section 1: Quản lý sức khỏe chuyên sâu */}

              <div onClick={() => onNavigate('ai')} className="flex items-center justify-between p-2 rounded-xl hover:bg-[#f6f3ed] cursor-pointer">
                <div>
                  <div className="font-bold text-[#1A201C]">🩺 AI Coach & Bác sĩ tư vấn</div>
                  <div className="text-[11px] text-[#687771]">Kế hoạch dinh dưỡng & thuốc cá nhân</div>

              <div className="h-[1px] bg-[#f0eee8]" />

                  <div className="text-[11px] text-[#687771]">Apple Watch Series 9 • Omron Blood</div>
                </div>
                <span className="px-2 py-0.5 rounded-full bg-[#c7e89e] text-[#0b3026] text-[10px] font-bold">Online</span>
              </div>
              <div className="h-[1px] bg-[#f0eee8]" />

              </button>

          </div>
        );
      }

      // ==========================================
      // ROOT APP COMPONENT (Mobile Container max-w-md)
      // ==========================================
      function App() {
        const [isAuthenticated, setIsAuthenticated] = useState(true);
        const [userProfile, setUserProfile] = useState({
          name: 'Michelle Nguyen',
          phone: '+1 929 391 82 81',
          email: 'michelle.ng@vitatrack.health',
          vitaId: 'VT-3311045090',
        });

        const [activeTab, setActiveTab] = useState('dashboard');
        const [currentRx, setCurrentRx] = useState(SYNTHETIC_DATA.prescriptions.standardCardioRx);
        const [schedule, setSchedule] = useState([
          { id: '1', time: '08:00', name: 'Amlodipine Besylate', dosage: '5mg', instruction: '1 viên sau ăn sáng', taken: true },
          { id: '2', time: '19:00', name: 'Metformin HCl', dosage: '500mg', instruction: '1 viên cùng bữa tối', taken: true },
          { id: '3', time: '21:30', name: 'Atorvastatin Calcium', dosage: '10mg', instruction: '1 viên trước khi ngủ', taken: false }
        ]);

        const handleToggleSchedule = (id) => {
          setSchedule((prev) => prev.map((s) => s.id === id ? { ...s, taken: !s.taken } : s));
        };

        const handleSaveSchedule = (meds) => {
          const updated = meds.map((m, idx) => ({
            id: `s-${idx}-${Date.now()}`,
            time: m.time || (idx === 0 ? '08:00' : idx === 1 ? '19:00' : '21:30'),
            name: m.name,
            dosage: m.dosage,
            instruction: m.instruction,
            taken: idx === 0
          }));
          setSchedule(updated);
        };

        const handleAuthenticated = (data) => {
          setUserProfile((prev) => ({ ...prev, ...data }));
          setIsAuthenticated(true);
          setActiveTab('dashboard');
        };

        return (
          <div className="min-h-screen py-0 sm:py-6 px-0 sm:px-4 flex flex-col items-center justify-center">
            {/* Desktop Top Pill with Quick Switch to Login/Signup */}
            <div className="hidden sm:flex items-center justify-between w-full max-w-md mb-3 px-3.5 py-1.5 rounded-full bg-[#0b3026] text-white text-xs shadow-md">
              <span className="flex items-center gap-1.5 font-bold text-[#cceda3]">
                <IconShieldCheck className="w-4 h-4" /> VitaTrack × TideCloak
              </span>
              <button
                type="button"
                onClick={() => setIsAuthenticated(!isAuthenticated)}
                className="px-2.5 py-0.5 rounded-full bg-white/15 hover:bg-white/25 text-[11px] font-bold text-[#cceda3] transition-colors"
              >
                {isAuthenticated ? '🔑 Xem trang Đăng Nhập / Đăng Ký' : '🏠 Vào thẳng Dashboard'}
              </button>
            </div>

            {/* Phone Container: max-w-md mx-auto, rounded corners, subtle border, centered */}
            <div className="w-full max-w-md mx-auto min-h-screen sm:min-h-[820px] sm:max-h-[880px] bg-[#FBF8F2] sm:rounded-[42px] sm:border-[8px] sm:border-[#1A201C] shadow-2xl flex flex-col relative overflow-hidden">
              {/* Notch */}
              <div className="hidden sm:flex items-center justify-between px-7 pt-2.5 pb-1 bg-[#FBF8F2] text-[11px] font-bold text-[#1A201C]">
                <span>09:41</span>
                <div className="w-24 h-3.5 bg-[#1A201C] rounded-full"></div>
                <span className="text-[10px] text-[#4b662b]">5G • 100%</span>
              </div>

              {!isAuthenticated ? (
                <div className="flex-1 overflow-y-auto no-scrollbar">
                  <AuthScreen onAuthenticated={handleAuthenticated} />
                </div>
              ) : (
                <>
                  {/* Header */}
                  <header className="sticky top-0 z-30 bg-[#FBF8F2]/90 backdrop-blur-md border-b border-[#ECE7DC] px-5 h-14 flex items-center justify-between shrink-0">
                    <div className="flex items-center gap-2">
                      <div className="w-8 h-8 rounded-full bg-[#c4ebda] flex items-center justify-center text-[#0b3026] font-bold text-xs"><IconActivity className="w-4 h-4" /></div>
                      <div>
                        <h1 className="text-xs font-extrabold text-[#1A201C]">VitaTrack Health</h1>
                        <span className="text-[9px] font-bold text-[#4b662b] block">Secured by TideCloak</span>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={() => setActiveTab('schedule')} className="w-8 h-8 rounded-full bg-[#F5EFE4] flex items-center justify-center text-[#1A201C]"><IconBell className="w-4 h-4" /></button>
                      <button
                        onClick={() => setActiveTab('profile')}
                        title="Hồ sơ cá nhân"
                        className={`w-8 h-8 rounded-full flex items-center justify-center transition-all ${activeTab === 'profile' ? 'bg-[#cceda3] text-[#0b3026] ring-2 ring-[#0b3026]' : 'bg-[#0b3026] text-white'}`}
                      >
                        <IconUser className="w-4 h-4" />
                      </button>
                    </div>
                  </header>

                  {/* Main Content Area */}
                  <main className="flex-1 overflow-y-auto no-scrollbar px-4 pt-3.5 pb-24">
                    {activeTab === 'dashboard' && <DashboardTab user={userProfile} onNavigate={setActiveTab} />}
                    {activeTab === 'scanner' && (
                      <ScannerTab
                        currentRx={currentRx}
                        onUpdateRx={setCurrentRx}
                        onNavigate={setActiveTab}
                        onSaveSchedule={handleSaveSchedule}
                      />
                    )}
                    {activeTab === 'ai' && <AiAssistantTab currentRx={currentRx} />}
                    {activeTab === 'schedule' && <ScheduleTab schedule={schedule} onToggle={handleToggleSchedule} />}
                    {activeTab === 'profile' && (
                      <ProfileTab
                        user={userProfile}
                        onNavigate={setActiveTab}
                        onLogout={() => setIsAuthenticated(false)}
                      />
                    )}
                  </main>

                  {/* 5-Tab Bottom Navigation (Matching Stitch Profile & App Navigation) */}
                  <div className="absolute bottom-3 left-0 right-0 z-40 px-3 pointer-events-none">
                    <nav className="pointer-events-auto w-full bg-white/95 backdrop-blur-md rounded-full p-1.5 shadow-xl border border-[#ECE7DC]">
                      <div className="grid grid-cols-5 gap-0.5">
                        {[
                          { id: 'dashboard', label: 'Home', icon: IconActivity },
                          { id: 'scanner', label: 'Scan Rx', icon: IconScanLine },
                          { id: 'ai', label: 'AI Health', icon: IconSparkles },
                          { id: 'schedule', label: 'Trends', icon: IconCalendar },
                          { id: 'profile', label: 'Profile', icon: IconUser }
                        ].map((tab) => {
                          const Icon = tab.icon;
                          const active = activeTab === tab.id;
                          return (
                            <button
                              key={tab.id}
                              onClick={() => setActiveTab(tab.id)}
                              className={`flex flex-col items-center justify-center py-2 rounded-full transition-all ${active ? 'bg-[#c7e89e] text-[#0b3026] font-extrabold shadow-sm' : 'text-[#687771] hover:text-[#1A201C]'}`}
                            >
                              <Icon className="w-4 h-4" />
                              <span className="text-[9.5px] mt-0.5">{tab.label}</span>
                            </button>
                          );
                        })}
                      </div>
                    </nav>
                  </div>
                </>
              )}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
