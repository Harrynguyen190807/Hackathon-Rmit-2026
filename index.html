                <div className="w-10 h-10 rounded-2xl bg-white/80 flex items-center justify-center"><IconMoon className="w-5 h-5 text-[#0b3026]" /></div>
                <div>
                  <div className="text-xs font-bold">Sleep Quality</div>
                  <div className="text-[11px] opacity-80">8.2 hrs • REM 2.4 hrs</div>
                </div>
              </div>
              <span className="px-2.5 py-1 rounded-full bg-[#0b3026] text-white text-[10px] font-bold">DEEP REST</span>
            </div>
          </div>
        );
      }

      // ==========================================
      // TAB 2: QUÉT ĐƠN THUỐC
      // ==========================================
      function ScannerTab({ onNavigate, onSaveSchedule }) {
        const [selectedRx, setSelectedRx] = useState('standardCardioRx');
        const [isScanning, setIsScanning] = useState(false);
        const [saved, setSaved] = useState(false);

        const rx = SYNTHETIC_DATA.prescriptions[selectedRx];
        const isCritical = rx.interaction.severity === 'CRITICAL';

        const handleSwitchRx = (key) => {
          setIsScanning(true);
          setTimeout(() => {
            setSelectedRx(key);
            setIsScanning(false);
          }, 500);
        };

        const handleSave = () => {
          onSaveSchedule(rx.medications);
          setSaved(true);
          setTimeout(() => setSaved(false), 2000);
        };

        return (
          <div className="space-y-4 pb-6">
            <div className="flex items-center justify-between">
              <div>
                <h2 className="text-lg font-bold text-[#1A201C]">Quét Đơn Thuốc AI</h2>
                <p className="text-xs text-[#687771]">OCR nhận diện & kiểm tra tương tác tại Edge</p>
              </div>
              <span className="px-2.5 py-1 rounded-full bg-[#cceda3] text-[#0b3026] text-[10px] font-bold">OCR 98.4%</span>
            </div>

            <TideCloakBadge context="Prescription OCR Sanitized Before AI Analysis" />

            {/* Camera Viewfinder */}
            <div className="rounded-3xl bg-white p-3 shadow-sm border border-[#ECE7DC]">
              <div className="relative w-full h-56 rounded-2xl overflow-hidden bg-[#163329] p-3 flex flex-col justify-between">
                {/* Simulated Rx Sheet */}
                <div className="relative z-10 bg-[#FBF8F2]/95 rounded-xl p-3 border border-[#ECE7DC] text-[#1A201C] space-y-1.5 shadow-inner">
                  <div className="flex justify-between items-center text-[10px] font-bold border-b border-[#ECE7DC] pb-1">
                    <span className="text-[#24473b]">{rx.title}</span>
                    <span className="text-[#687771] font-mono">[PII_REDACTED]</span>
                  </div>
                  <div className="space-y-1 text-xs">
                    {rx.medications.map((m, i) => (
                      <div key={m.id} className="flex justify-between bg-white px-2 py-1 rounded border border-[#ECE7DC]">
                        <span className="font-bold text-[#0b3026]">{i+1}. {m.name} ({m.dosage})</span>
                        <span className="font-mono text-[10px] text-[#687771]">{m.time}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Laser scan */}
                <div className="absolute left-2 right-2 h-0.5 bg-gradient-to-r from-transparent via-[#cceda3] to-transparent shadow-[0_0_10px_#cceda3] animate-scan-laser pointer-events-none z-20" />

                {/* Reticle */}
                <div className="absolute inset-2 border-2 border-[#cceda3]/40 rounded-2xl pointer-events-none z-10" />

                <div className="relative z-20 flex justify-center">
                  <button onClick={() => handleSwitchRx(selectedRx)} className="w-10 h-10 rounded-full bg-white flex items-center justify-center text-[#0b3026] shadow-md active:scale-90 transition-transform">
                    <IconCamera className="w-5 h-5 text-[#24473b]" />
                  </button>
                </div>
              </div>

              {/* Sample Switcher */}
              <div className="grid grid-cols-2 gap-2 mt-2.5">
                <button
                  onClick={() => handleSwitchRx('standardCardioRx')}
                  className={`py-2 px-2 rounded-xl text-xs font-bold transition-colors ${selectedRx === 'standardCardioRx' ? 'bg-[#c7e89e] text-[#0b3026]' : 'bg-[#F5EFE4] text-[#687771]'}`}
                >
                  Mẫu 1: Tim Mạch (Vàng)
                </button>
                <button
                  onClick={() => handleSwitchRx('criticalConflictRx')}
                  className={`py-2 px-2 rounded-xl text-xs font-bold transition-colors ${selectedRx === 'criticalConflictRx' ? 'bg-[#ffdad6] text-[#93000a] ring-1 ring-[#ba1a1a]/30' : 'bg-[#F5EFE4] text-[#687771]'}`}
                >
                  Mẫu 2: Xung Đột Nặng (Đỏ)
                </button>
              </div>
            </div>

            {/* Interaction Banner */}
            <div className={`rounded-2xl p-4 border flex items-start gap-3 ${isCritical ? 'bg-[#ffdad6] text-[#93000a] border-[#ba1a1a]/30' : 'bg-[#ffdcc5] text-[#462000] border-[#F3A871]/50'}`}>
              <div className={`w-8 h-8 rounded-xl flex items-center justify-center shrink-0 ${isCritical ? 'bg-[#ba1a1a] text-white' : 'bg-[#F3A871] text-white'}`}>
                <IconAlertTriangle className="w-5 h-5" />
              </div>
              <div className="text-xs space-y-0.5">
                <div className="flex items-center justify-between flex-wrap">
                  <span className="font-extrabold">{rx.interaction.title}</span>
                  <span className="text-[9px] px-1.5 py-0.5 rounded font-extrabold uppercase bg-white/60">{rx.interaction.badge}</span>
                </div>
                <p className="leading-relaxed opacity-95">{rx.interaction.desc}</p>
              </div>
            </div>

            {/* Medication List */}
            <div className="space-y-2">
              <h3 className="text-xs font-bold text-[#1A201C] px-1">Danh sách bóc tách ({rx.medications.length} loại thuốc)</h3>
              {rx.medications.map((m) => (
                <div key={m.id} className="rounded-2xl bg-white p-3.5 shadow-sm border border-[#ECE7DC] flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <div className="w-9 h-9 rounded-xl bg-[#f6f3ed] flex items-center justify-center text-[#24473b]"><IconPill className="w-4 h-4" /></div>
                    <div>
                      <div className="text-xs font-bold text-[#1A201C]">{m.name} ({m.dosage})</div>
                      <div className="text-[11px] text-[#687771]">{m.instruction}</div>
                    </div>
                  </div>
                  <div className="text-right">
                    <span className="text-sm font-extrabold text-[#0b3026]">{m.time}</span>
                    <span className="block text-[9px] text-[#687771] uppercase font-bold">{m.period}</span>
                  </div>
                </div>
              ))}
            </div>

            <div className="space-y-2 pt-1">
              <button
                onClick={handleSave}
                className={`w-full py-3.5 rounded-full text-xs font-bold text-white shadow-md transition-all ${saved ? 'bg-[#4b662b]' : 'bg-[#24473b] hover:bg-[#0b3026]'}`}
              >
                {saved ? '✓ Đã đồng bộ vào Lịch nhắc thuốc!' : 'Lưu lịch uống thuốc tự động (08:00, 19:00, 21:30)'}
              </button>
              <button
                onClick={() => onNavigate('ai')}
                className="w-full py-3 rounded-full text-xs font-bold text-[#0b3026] bg-[#F5EFE4] hover:bg-[#e5e2dc] transition-colors"
              >
                Hỏi Bác Sĩ AI giải mã đơn này &rarr;
              </button>
            </div>
          </div>
        );
      }

      // ==========================================
      // TAB 3: AI ASSISTANT
      // ==========================================
      function AiAssistantTab() {
        const [messages, setMessages] = useState([
          { id: 1, role: 'user', text: 'Thuốc này có gây tác dụng phụ gì phổ biến không?' },
          {
            id: 2,
            role: 'ai',
            text: 'Dựa trên hồ sơ dược lý ẩn danh (Zero-Knowledge Attested), Amlodipine 5mg và Atorvastatin có thể gây một số phản ứng nhẹ:',
            details: [
              'Tác dụng phụ thường gặp: Buồn ngủ nhẹ, đỏ bừng mặt hoặc hơi phù cổ chân vào chiều tối (thường giảm sau 1-2 tuần).',
              'Xử trí khi quên liều: Nếu còn trên 12 tiếng tới liều kế tiếp thì uống ngay. Tuyệt đối KHÔNG uống gấp đôi liều để bù.'
            ]
          }
        ]);
        const [input, setInput] = useState('');

        const handleSend = (text) => {
          const q = (text || input).trim();
          if (!q) return;
          const userM = { id: Date.now(), role: 'user', text: q };
          setMessages((prev) => [...prev, userM]);
          if (!text) setInput('');

          setTimeout(() => {
            let replyText = `Đã phân tích câu hỏi "${q}" trên vùng dữ liệu mã hóa TideCloak Edge.`;
            let details = null;
            if (q.includes('ăn') || q.includes('khi nào')) {
              details = [
                '08:00 Sáng: Amlodipine 5mg sau ăn sáng 15 phút với ly nước đầy.',
                '19:00 Tối: Metformin 500mg ngay trong bữa tối để giảm cồn cào dạ dày.',
                '21:30 Đêm: Atorvastatin 10mg trước khi đi ngủ.'
              ];
            } else if (q.includes('kiêng') || q.includes('bưởi')) {
              details = [
                'Tuyệt đối kiêng Nước ép bưởi chùm (Grapefruit) do ức chế enzyme CYP3A4.',
                'Hạn chế muối (< 5g/ngày) và uống đủ 2L nước lọc.'
              ];
            } else {
              details = ['Chỉ số sinh trắc học hiện tại (HA 120/78, Nhịp tim 70) đang ở mức an toàn. Hãy duy trì lịch uống đúng giờ.'];
            }
            setMessages((prev) => [...prev, { id: Date.now() + 1, role: 'ai', text: replyText, details }]);
          }, 350);
        };

        return (
          <div className="space-y-3.5 pb-6">
            <div className="flex items-center justify-between bg-white p-3 rounded-2xl border border-[#ECE7DC] shadow-sm">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-full bg-[#c7e89e] flex items-center justify-center text-[#0b3026]"><IconBot className="w-4 h-4" /></div>
                <div>
                  <div className="text-xs font-bold text-[#1A201C]">Asclepios AI Bác Sĩ</div>
                  <div className="text-[10px] text-[#687771]">Trợ lý dược lâm sàng 24/7</div>
                </div>
              </div>
              <span className="px-2 py-0.5 rounded-full bg-[#f6f3ed] text-[#4b662b] text-[10px] font-bold">E2E ZKP</span>
            </div>

            <TideCloakBadge context="Zero-Knowledge Proof Verified • Anonymous AI Context" />

            {/* Chat Thread */}
            <div className="space-y-3">
              {messages.map((m) => (
                <div key={m.id} className={`flex flex-col ${m.role === 'user' ? 'items-end' : 'items-start'}`}>
                  <div className={`p-3.5 rounded-2xl text-xs max-w-[88%] leading-relaxed ${m.role === 'user' ? 'bg-[#24473b] text-white rounded-tr-sm' : 'bg-white text-[#1A201C] border border-[#ECE7DC] rounded-tl-sm shadow-sm'}`}>
                    <p>{m.text}</p>
                    {m.details && (
                      <div className="mt-2 space-y-1.5 pt-1.5 border-t border-[#ECE7DC]">
                        {m.details.map((d, i) => (
                          <div key={i} className="text-[11px] text-[#414845] bg-[#f6f3ed] p-2 rounded-xl">• {d}</div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>

            {/* Chips */}
            <div className="flex gap-1.5 overflow-x-auto no-scrollbar py-1">
              {['Tác dụng phụ?', 'Uống trước hay sau ăn?', 'Cần kiêng cữ gì?', 'Kết nối bác sĩ'].map((c) => (
                <button
                  key={c}
                  onClick={() => handleSend(c)}
                  className="shrink-0 bg-white border border-[#ECE7DC] px-3 py-1.5 rounded-full text-xs font-bold text-[#0b3026] hover:bg-[#f6f3ed]"
                >
                  {c}
                </button>
              ))}
            </div>

            {/* Input Dock */}
            <div className="flex gap-2 bg-white p-2 rounded-2xl border border-[#ECE7DC] shadow-sm">
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                placeholder="Hỏi AI bảo mật về đơn thuốc..."
                className="flex-1 text-xs outline-none px-2"
              />
              <button onClick={() => handleSend()} className="w-8 h-8 rounded-full bg-[#24473b] text-white flex items-center justify-center text-xs font-bold">&uarr;</button>
            </div>
          </div>
        );
      }

      // ==========================================
      // TAB 4: LỊCH TRÌNH (08:00, 19:00, 21:30)
      // ==========================================
      function ScheduleTab({ schedule, onToggle }) {
        const completed = schedule.filter((s) => s.taken).length;
        const adherence = Math.round((completed / schedule.length) * 100);

        return (
          <div className="space-y-4 pb-6">
            <div className="bg-white rounded-3xl p-4 shadow-sm border border-[#ECE7DC]">
              <div className="flex justify-between items-center mb-3">
                <span className="text-sm font-bold text-[#1A201C]">Tháng 10, 2026</span>
                <span className="text-xs font-bold text-[#4b662b]">{adherence}% Tuân thủ tuần này</span>
              </div>
              <div className="grid grid-cols-7 gap-1 text-center text-xs">
                {['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'].map((d, i) => (
                  <div key={d} className="flex flex-col items-center gap-1">
                    <span className="text-[10px] text-[#687771]">{d}</span>
                    <span className={`w-8 h-8 rounded-full flex items-center justify-center font-bold ${i === 3 ? 'bg-[#0b3026] text-white shadow-sm' : 'text-[#1A201C]'}`}>
                      {17 + i}
                    </span>
                  </div>
                ))}
              </div>
            </div>

            {/* Slots */}
            <div className="bg-white rounded-3xl p-4 shadow-sm border border-[#ECE7DC] space-y-3">
              <div className="flex justify-between items-center">
                <span className="text-xs font-bold text-[#1A201C]">Lịch nhắc uống thuốc hôm nay</span>
                <span className="text-[10px] text-[#687771]">Chạm để cập nhật</span>
              </div>

              <div className="space-y-2">
                {schedule.map((item) => (
                  <div
                    key={item.id}
                    onClick={() => onToggle(item.id)}
                    className={`rounded-2xl p-3 border flex items-center justify-between cursor-pointer transition-all ${item.taken ? 'bg-[#f6f3ed] border-[#c7e89e]' : 'bg-white border-[#ECE7DC]'}`}
                  >
                    <div className="flex items-center gap-2.5">
                      <div className={`px-2.5 py-1.5 rounded-xl font-extrabold text-xs ${item.taken ? 'bg-[#0b3026] text-[#cceda3]' : 'bg-[#F5EFE4] text-[#0b3026]'}`}>
                        {item.time}
                      </div>
                      <div>
                        <div className={`text-xs font-bold ${item.taken ? 'line-through text-[#687771]' : 'text-[#1A201C]'}`}>
                          {item.name} ({item.dosage})
                        </div>
                        <div className="text-[10px] text-[#687771]">{item.instruction}</div>
                      </div>
                    </div>
                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${item.taken ? 'bg-[#c7e89e] text-[#0b3026]' : 'bg-[#ffdcc5] text-[#663304]'}`}>
                      {item.taken ? 'Đã uống' : 'Chờ uống'}
                    </span>
                  </div>
                ))}
              </div>
            </div>

            {/* Sleep card */}
            <div className="rounded-3xl bg-gradient-to-r from-[#D5EDAF] to-[#E9F6D6] p-4 text-[#0b3026] flex items-center justify-between shadow-sm">
              <div>
                <span className="text-xs font-bold">Sleep Overview • Tuần này</span>
                <div className="text-xl font-extrabold mt-0.5">8.2 giờ <span className="text-xs font-normal">trung bình/đêm</span></div>
              </div>
              <div className="w-10 h-10 rounded-2xl bg-[#0b3026] text-[#cceda3] flex items-center justify-center font-bold text-xs"><IconMoon className="w-5 h-5" /></div>
            </div>
          </div>
        );
      }

      // ==========================================
      // ROOT APP COMPONENT (Mobile Container max-w-md)
      // ==========================================
      function App() {
        const [activeTab, setActiveTab] = useState('dashboard');
        const [schedule, setSchedule] = useState([
          { id: '1', time: '08:00', name: 'Amlodipine Besylate', dosage: '5mg', instruction: '1 viên sau ăn sáng', taken: true },
          { id: '2', time: '19:00', name: 'Metformin HCl', dosage: '500mg', instruction: '1 viên cùng bữa tối', taken: true },
          { id: '3', time: '21:30', name: 'Atorvastatin Calcium', dosage: '10mg', instruction: '1 viên trước khi ngủ', taken: false }
        ]);

        const handleToggleSchedule = (id) => {
          setSchedule((prev) => prev.map((s) => s.id === id ? { ...s, taken: !s.taken } : s));
        };

        const handleSaveSchedule = (meds) => {
          const updated = meds.map((m, idx) => ({
            id: `s-${idx}-${Date.now()}`,
            time: m.time || (idx === 0 ? '08:00' : idx === 1 ? '19:00' : '21:30'),
            name: m.name,
            dosage: m.dosage,
            instruction: m.instruction,
            taken: idx === 0
          }));
          setSchedule(updated);
        };

        return (
          <div className="min-h-screen py-0 sm:py-6 px-0 sm:px-4 flex flex-col items-center justify-center">
            {/* Desktop Top Pill */}
            <div className="hidden sm:flex items-center justify-between w-full max-w-md mb-3 px-3.5 py-1.5 rounded-full bg-[#0b3026] text-white text-xs shadow-md">
              <span className="flex items-center gap-1.5 font-bold text-[#cceda3]">
                <IconShieldCheck className="w-4 h-4" /> VitaTrack Health × TideCloak
              </span>
              <span className="text-[10px] text-[#a9cfbf] font-mono">Zero-Knowledge Proof Verified</span>
            </div>

            {/* Phone Container: max-w-md mx-auto, rounded corners, subtle border, centered */}
            <div className="w-full max-w-md mx-auto min-h-screen sm:min-h-[820px] sm:max-h-[880px] bg-[#FBF8F2] sm:rounded-[42px] sm:border-[8px] sm:border-[#1A201C] shadow-2xl flex flex-col relative overflow-hidden">
              {/* Notch */}
              <div className="hidden sm:flex items-center justify-between px-7 pt-2.5 pb-1 bg-[#FBF8F2] text-[11px] font-bold text-[#1A201C]">
                <span>09:41</span>
                <div className="w-24 h-3.5 bg-[#1A201C] rounded-full"></div>
                <span className="text-[10px] text-[#4b662b]">5G • 100%</span>
              </div>

              {/* Header */}
              <header className="sticky top-0 z-30 bg-[#FBF8F2]/90 backdrop-blur-md border-b border-[#ECE7DC] px-5 h-14 flex items-center justify-between shrink-0">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-full bg-[#c4ebda] flex items-center justify-center text-[#0b3026] font-bold text-xs"><IconActivity className="w-4 h-4" /></div>
                  <div>
                    <h1 className="text-xs font-extrabold text-[#1A201C]">VitaTrack Health</h1>
                    <span className="text-[9px] font-bold text-[#4b662b] block">Secured by TideCloak</span>
                  </div>
                </div>
                <button onClick={() => setActiveTab('schedule')} className="w-8 h-8 rounded-full bg-[#F5EFE4] flex items-center justify-center text-[#1A201C]"><IconBell className="w-4 h-4" /></button>
              </header>

              {/* Main Content Area */}
              <main className="flex-1 overflow-y-auto no-scrollbar px-4 pt-3.5 pb-24">
                {activeTab === 'dashboard' && <DashboardTab onNavigate={setActiveTab} />}
                {activeTab === 'scanner' && <ScannerTab onNavigate={setActiveTab} onSaveSchedule={handleSaveSchedule} />}
                {activeTab === 'ai' && <AiAssistantTab />}
                {activeTab === 'schedule' && <ScheduleTab schedule={schedule} onToggle={handleToggleSchedule} />}
              </main>

              {/* 4-Tab Bottom Navigation */}
              <div className="absolute bottom-3 left-0 right-0 z-40 px-4 pointer-events-none">
                <nav className="pointer-events-auto w-full bg-white/95 backdrop-blur-md rounded-full p-1.5 shadow-xl border border-[#ECE7DC]">
                  <div className="grid grid-cols-4 gap-1">
                    {[
                      { id: 'dashboard', label: 'Dashboard', icon: IconActivity },
                      { id: 'scanner', label: 'Quét Đơn', icon: IconScanLine },
                      { id: 'ai', label: 'AI Trợ Lý', icon: IconSparkles },
                      { id: 'schedule', label: 'Lịch Trình', icon: IconCalendar }
                    ].map((tab) => {
                      const Icon = tab.icon;
                      const active = activeTab === tab.id;
                      return (
                        <button
                          key={tab.id}
                          onClick={() => setActiveTab(tab.id)}
                          className={`flex flex-col items-center justify-center py-2 rounded-full transition-all ${active ? 'bg-[#c7e89e] text-[#0b3026] font-extrabold shadow-sm' : 'text-[#687771] hover:text-[#1A201C]'}`}
                        >
                          <Icon className="w-4 h-4" />
                          <span className="text-[10px] mt-0.5">{tab.label}</span>
                        </button>
                      );
                    })}
                  </div>
                </nav>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
